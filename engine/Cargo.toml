[package]
name = "djengine"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
cpal = { version = "0.18.2", features = ["realtime"] }
rtrb = "0.4.1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["mp3", "aac", "isomp4", "flac", "wav", "aiff", "ogg", "vorbis", "pcm", "alac"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_Foundation", "Win32_Media_KernelStreaming", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading", "Win32_Foundation"] }
